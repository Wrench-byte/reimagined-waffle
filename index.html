<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Самая красивая</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Frase principal */
        h1 {
            color: #d90429;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            padding: 0 20px;
            z-index: 10;
        }

        /* Contenedor del espejo y decoraciones */
        .mirror-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* Círculo rosa con la cámara */
        .mirror-circle {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 8px solid #ff4d6d;
            box-shadow: 0 10px 25px rgba(255, 77, 109, 0.5);
            overflow: hidden;
            position: relative;
            background-color: #fff;
        }

        /* El elemento de video invertido para efecto espejo */
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo */
        }

        /* Decoraciones alrededor (Estrellas / Destellos flotantes) */
        .decoration {
            position: absolute;
            font-size: 1.8rem;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }

        .dec1 { top: -10px; left: -10px; animation-delay: 0s; }
        .dec2 { top: -20px; right: -5px; animation-delay: 0.5s; }
        .dec3 { bottom: -10px; left: -15px; animation-delay: 1s; }
        .dec4 { bottom: -15px; right: -10px; animation-delay: 1.5s; }
        .dec5 { top: 45%; left: -35px; animation-delay: 0.7s; font-size: 2.2rem; }
        .dec6 { top: 40%; right: -35px; animation-delay: 1.2s; font-size: 2.2rem; }

        /* Animación de flotación suave */
        @keyframes float {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-10px) scale(1.1);
            }
        }

        /* Mensaje de error por si no hay cámara */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4d6d;
            text-align: center;
            font-weight: bold;
            padding: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Frase solicitada -->
    <h1>Самая красивая девушка в мире</h1>

    <!-- Estructura central -->
    <div class="mirror-container">
        <!-- Decoraciones florales/brillos -->
        <div class="decoration dec1">🌸</div>
        <div class="decoration dec2">✨</div>
        <div class="decoration dec3">✨</div>
        <div class="decoration dec4">🌸</div>
        <div class="decoration dec5">💖</div>
        <div class="decoration dec6">💖</div>

        <!-- Círculo Espejo -->
        <div class="mirror-circle">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="error" class="error-message">Por favor, permite el acceso a la cámara.</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const errorDiv = document.getElementById('error');

        // Solicitar acceso a la cámara frontal preferentemente
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, // Fuerza el uso de la cámara frontal en móviles
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
                errorDiv.style.display = "block";
            }
        }

        // Iniciar la cámara al cargar la página
        window.addEventListener('DOMContentLoaded', initCamera);
    </script>
</body>
</html>
